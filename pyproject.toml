
[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cating_processor"
version = "0.1.0"
description = "a script to increase the sharpness of a photo"
authors = [
    {name = "Andreev I.S.", email = "andree.i.s@yandex.ru"},
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pillow>=9.0.0",
    "scipy>=1.7.0",
    "numba>=0.55.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=0.19.0",
]

[project.scripts]
cating_processor = "cating_processor.__main__:main"