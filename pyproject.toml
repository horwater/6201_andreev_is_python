[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cating_processor"
version = "0.1.0"
description = "a script to increase the sharpness of a photo"
authors = [
    {name = "Andreev I.S.", email = "andree.i.s@yandex.ru"},
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21.0",
    "pillow>=9.0.0",
    "scipy>=1.7.0",
    "numba>=0.55.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.15.0",
    "black>=22.0",
    "flake8>=4.0.0",
    "mypy>=0.910",
]

[project.urls]
Homepage = "https://github.com/horwater/6201_andreev_is_python/tree/main"
BugTracker = "https://github.com/horwater/6201_andreev_is_python/issues"

[project.scripts]
cating-processor = "cating_processor.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cating_processor*"]
exclude = ["tests*", "docs*"]